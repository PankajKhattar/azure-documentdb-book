services:
  documentdb:
    image: ghcr.io/documentdb/documentdb/documentdb-local:latest
    container_name: documentdb-local
    ports:
      - "27017:27017"
    command:
      - "documentdb"
      - "--username=bookuser"
      - "--password=bookpassword"
    volumes:
      - documentdb_data:/var/lib/documentdb/data

volumes:
  documentdb_data:
